source_key: pokemon_go_api
endpoint: maxbattles
# Hand-authored (Task 20), not profiler-generated: the current raw snapshot's
# maxbattles.json is `{"currentList": []}` -- genuinely empty upstream right
# now (confirmed in KNOWN_ISSUES.md's "Fixed since the last pass" section,
# re-confirmed for this task), so SourceProfiler.detect_shape() has no records
# to infer a shape from. Shape/field names below are carried over from the
# pre-existing hand-parsed max_battles loop this task deletes, and mirror
# pokemon_go_api_raidboss.yml's raidboss template (max battles use the same
# currentList/tier-keyed container shape upstream) -- re-run
# `uv run go_refs.py --deep-dive pokemon_go_api` once a real Max Battle
# rotation goes live to confirm field names against real data.
#
# Same single-source, composite-identity (tier, id) reasoning as raidboss:
# read via engine.extract_transformed_records(), not run_source().
record_extraction:
  unwrap_path:
  - currentList
  iterate_mode: dict_of_lists
  key_becomes_field: tier
identity_field: id
field_mappings:
  tier:
    source_field: tier
    transform: direct
  pokemon_id:
    source_field: id
    transform: direct
  name:
    source_field: names.English
    transform: nested_path
    fallback_field: id
  form:
    source_field: form
    transform: direct
  costume:
    source_field: costume
    transform: direct
  max_particles_cost:
    source_field: max_particles_cost
    transform: direct
  shiny_available:
    source_field: shiny
    transform: boolean
  image_url:
    source_field: assets.image
    transform: nested_path
  shiny_image_url:
    source_field: assets.shinyImage
    transform: nested_path
gender_signals: []
overrides: {}
needs_review: []

source_key: pvpoke
endpoint: gamemaster
# See pvpoke_moves.yml's note: unwrap_path is hand-authored to target "formats"
# specifically, not auto-picked by the profiler (which would pick "pokemon").
record_extraction:
  unwrap_path: [formats]
  iterate_mode: top_level_list
# Confirmed via rank_identity_candidates(): title is 14/14 unique, matches the
# legacy code's league_id = fmt.get("title").
identity_field: title
# entity_id_prefix matches the legacy "pvp_league_<title>" entity_id scheme exactly
# (title is a plain string used as-is, no numeric coercion needed -- see
# engine.py's entity_id_prefix caveat comment), so no cross-source join is needed
# here unlike pvpoke_moves.yml.
entity_id_prefix: pvp_league
field_mappings:
  cp_limit:
    source_field: cp
    transform: direct
  meta:
    source_field: meta
    transform: direct
gender_signals: []
overrides: {}
needs_review: []

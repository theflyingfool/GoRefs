source_key: fixture_gm
endpoint: GAME_MASTER
entity_id_prefix: pokemon_dex
record_extraction:
  unwrap_path: [data, pokemonSettings]
  iterate_mode: list_of_dicts_with_subkey
  key_becomes_field: templateId
identity_field: dex_number
field_mappings:
  base_attack:
    source_field: stats.baseAttack
    transform: nested_path
  base_defense:
    source_field: stats.baseDefense
    transform: nested_path
  base_stamina:
    source_field: stats.baseStamina
    transform: nested_path
gender_signals: []
overrides:
  dex_number:
    source_field: templateId
    transform: regex_extract
    pattern: "^V(\\d{4})_POKEMON_"
    group: 1
needs_review: []

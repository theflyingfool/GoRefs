[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"

# Local fork of tauri-plugin-sql 2.4.0 pinning the sqlx SQLite pool to a single
# connection (max_connections = 1). Upstream 2.4.0 — and, as of this writing, the
# plugins-workspace `v2` branch — exposes no way to configure the pool, so a
# cross-call transaction can otherwise land on different pooled connections and
# deadlock into SQLITE_BUSY. See src-tauri/vendor/tauri-plugin-sql/GOBUDDY_PATCH.md
# for the full rationale and how to check whether upstream has made this fork
# obsolete. The `tauri-plugin-sql = "2.4.0"` line above still declares the
# dependency; this only redirects where cargo resolves it from.
[patch.crates-io]
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql" }

# Verification-only. Exercises the exact sqlx-pool behavior the vendored
# tauri-plugin-sql fork above relies on (see tests/pool_transaction.rs). sqlx is
# already an indirect dependency via tauri-plugin-sql, so this pins no new
# version — it only makes it directly test-visible.
[dev-dependencies]
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

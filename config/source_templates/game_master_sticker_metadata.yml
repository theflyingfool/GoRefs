source_key: alexelgt_game_masters
endpoint: GAME_MASTER
record_extraction:
  unwrap_path: [data, stickerMetadata]
  iterate_mode: list_of_dicts_with_subkey
identity_field: stickerId
field_mappings:
  sticker_id:
    source_field: stickerId
    transform: direct
  max_count:
    source_field: maxCount
    transform: direct
  asset_id_raw:
    source_field: assetId
    transform: direct
  sticker_url:
    source_field: stickerUrl
    transform: direct
  pokemon_id_raw:
    source_field: pokemonId
    transform: direct
gender_signals: []
overrides: {}
needs_review: []
# Single-source domain (Task 20 pattern -- extract_transformed_records(), no
# ledger). stickerId is present on all 617 real records, so the legacy
# `stickerMetadata.get("stickerId") or template_id` fallback is dead code and
# not replicated (same reasoning as game_master_item_settings.yml).
#
# asset_id is a real 3-way fallback chain in the legacy code (`assetId or
# stickerUrl or str(pokemonId or "")`) that a single field_mappings entry
# can't express -- assetId, stickerUrl, and pokemonId are all mapped
# separately here (as asset_id_raw/sticker_url/pokemon_id_raw) and combined
# into the canonical `asset_id` column in builder.py. Verified against the
# real dump: assetId is NEVER present (0/617) in practice, so the chain
# effectively reduces to `stickerUrl or str(pokemonId or "")` today; 62/617
# records have neither and legacy's `str(None or "")` produces an empty
# string "" for those (not None) -- builder.py's combination replicates
# that exact empty-string behavior, not None.

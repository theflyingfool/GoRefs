source_key: alexelgt_game_masters
endpoint: GAME_MASTER
record_extraction:
  unwrap_path: [data, playerLevel]
  iterate_mode: list_of_dicts_with_subkey
identity_field: id
field_mappings:
  cp_multiplier_list:
    source_field: cpMultiplier
    transform: direct
gender_signals: []
overrides: {}
needs_review: []
# NOT run through run_source()'s claims/entity ledger: this is a single raw
# record (there is exactly one PLAYER_LEVEL_SETTINGS template) whose real
# content is an 80-element array that needs to EXPAND into 80 progression
# rows (one per player level, 1-80) -- a shape run_source()'s one-entity-id-
# per-record model has no way to express, and identity_field has nothing
# meaningful to key on (there is no "id" field on this record; identity_field
# is set here only because the template schema requires some value, and it
# is never read since builder.py calls extract_transformed_records() instead
# of run_source() for this template). builder.py reads back
# cp_multiplier_list (the raw array, untouched) via extract_transformed_
# records() and does the level-1..80 enumeration itself, preserving the
# PRIMARY+FALLBACK mechanism the legacy code had (falling back to
# pogoapi_net's cp_multiplier raw dump if this ever comes back empty --
# verified still populated with all 80 values in the real dump today, so the
# fallback is currently unexercised but intentionally preserved, not dead
# code removed).

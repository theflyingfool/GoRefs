source_key: alexelgt_game_masters
endpoint: GAME_MASTER
record_extraction:
  unwrap_path: [data, itemSettings]
  iterate_mode: list_of_dicts_with_subkey
identity_field: itemId
field_mappings:
  item_id:
    source_field: itemId
    transform: direct
  item_type:
    source_field: itemType
    transform: direct
  category:
    source_field: category
    transform: direct
  drop_trainer_level:
    source_field: dropTrainerLevel
    transform: direct
gender_signals: []
overrides: {}
needs_review: []
# Single-source domain (alexelgt is the ONLY source of item data) -- per
# Task 20's raid_bosses/max_battles precedent, builder.py reads this via
# extract_transformed_records() rather than run_source()'s claims/ledger
# machinery, since there is no cross-source claim to arbitrate. itemId is
# present on all 159 real records (verified against the raw dump), so the
# legacy `item_settings.get("itemId") or template_id` fallback to templateId
# is provably dead code today and is not replicated -- if a future
# GAME_MASTER update ever ships an itemSettings record with no itemId, that
# record's item_id (and therefore identity_field) would simply be absent
# rather than falling back to templateId (extract_transformed_records() has
# no access to the parent templateId anyway, since it doesn't opt into the
# key_becomes_field templateId injection this template doesn't declare).

source_key: alexelgt_game_masters
endpoint: GAME_MASTER
record_extraction:
  unwrap_path: [data, avatarCustomization]
  iterate_mode: list_of_dicts_with_subkey
identity_field: avatar_id
field_mappings:
  avatar_id:
    source_field: assetName
    transform: direct
  slot:
    source_field: slot
    transform: direct
  unlock_player_level:
    source_field: unlockPlayerLevel
    transform: direct
gender_signals: []
overrides: {}
needs_review: []
# Single-source domain (Task 20 pattern -- extract_transformed_records(), no
# ledger). Legacy avatar_id was `avatarCustomization.get("avatarId") or
# .get("assetName") or .get("iconName") or template_id` -- verified against
# the real dump that avatarId is NEVER present on any of the 1757 real
# records, and assetName always is, so the fallback chain reduces to just
# assetName in practice; iconName/templateId are never reached and not
# replicated.
#
# `slot` is a raw LIST (e.g. ["BACKPACK"]), not a joined string -- legacy
# stored it as-is (`avatar_cust.get("slot")`), and this template preserves
# that exact shape rather than flattening it.

source_key: alexelgt_game_masters
endpoint: GAME_MASTER
entity_id_prefix: game_master_move
record_extraction:
  unwrap_path: [data, combatMove]
  iterate_mode: list_of_dicts_with_subkey
identity_field: uniqueId
field_mappings:
  type_raw:
    source_field: type
    transform: direct
  power:
    source_field: power
    transform: direct
  energy_delta:
    source_field: energyDelta
    transform: direct
  duration_turns:
    source_field: durationTurns
    transform: direct
gender_signals: []
overrides: {}
needs_review: []
# No collision risk here (unlike pokemonSettings): every combatMove record's
# uniqueId is genuinely unique across the raw dump (verified: 324 records,
# 324 distinct uniqueIds), so no last-wins collapse is needed for this
# template's claims.
#
# These claims land under "game_master_move_<uniqueId>" (e.g.
# "game_master_move_WRAP"), a STRING-keyed namespace, which never collides
# with pogoapi_net's/pvpoke's "move_<numeric_pogoapi_net_id>" entities on its
# own -- GAME_MASTER's combat move records carry no numeric id at all, only
# this string uniqueId. builder.py joins the two namespaces itself by
# normalizing pogoapi_net's move `name` field (e.g. "Fury Cutter" ->
# "FURY_CUTTER", trying a "_FAST" suffix too for fast moves only) and looking it
# up against this template's claims, then re-emitting matched claims under
# the numeric move_<id> entity so they actually compete with pogoapi_net's
# own type/pve_power/pve_energy_delta claims in trust-tier resolution --
# see collect_and_resolve_claims()'s gm_move_join block, the same join
# pattern Task 19 used for pvpoke's moves.

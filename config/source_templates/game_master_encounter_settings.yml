source_key: alexelgt_game_masters
endpoint: GAME_MASTER
record_extraction:
  unwrap_path: [data, encounterSettings]
  iterate_mode: list_of_dicts_with_subkey
identity_field: template_id
field_mappings:
  spin_bonus_threshold:
    source_field: spinBonusThreshold
    transform: direct
  excellent_throw_threshold:
    source_field: excellentThrowThreshold
    transform: direct
  great_throw_threshold:
    source_field: greatThrowThreshold
    transform: direct
  nice_throw_threshold:
    source_field: niceThrowThreshold
    transform: direct
gender_signals: []
overrides: {}
needs_review: []
# Single-source domain (Task 20 pattern -- extract_transformed_records(), no
# ledger). Legacy's identity was the record's own templateId (always the
# literal constant "ENCOUNTER_SETTINGS" -- verified there is exactly one
# encounterSettings record in the real dump, and always this templateId).
# This template does not opt into the key_becomes_field templateId
# injection (encounterSettings' sub-record has no field of its own that
# collides with a real templateId-sourced attribute anyway), so builder.py
# hardcodes the "ENCOUNTER_SETTINGS" constant when building this domain's
# entity_id for emit_claim()'s audit trail, matching the real, always-true
# shape of this single-record domain rather than adding templateId-injection
# plumbing for a value that never varies.

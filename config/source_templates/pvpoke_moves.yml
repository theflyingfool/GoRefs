source_key: pvpoke
endpoint: gamemaster
# NOTE for future re-profiling: SourceProfiler.profile_source("pvpoke", "gamemaster")
# picks "pokemon" as the primary record list (it has far more records than "moves"),
# not this one -- per Task 19's brief, pvpoke's pokemon list is explicitly NOT
# templated in this cutover (future scope). This template's unwrap_path is
# hand-authored to target "moves" specifically and should not be blindly
# regenerated by re-running the profiler over the whole gamemaster.json payload.
record_extraction:
  unwrap_path: [moves]
  iterate_mode: top_level_list
# Confirmed via rank_identity_candidates(): moveId is 334/334 unique (name is only
# 199/200 unique in-sample -- not a safe identity field).
identity_field: moveId
field_mappings:
  pvp_power:
    source_field: power
    transform: direct
  pvp_energy_cost:
    source_field: energy
    transform: direct
  pvp_cooldown_turns:
    source_field: turns
    transform: direct
  buffs:
    source_field: buffs
    transform: direct
  buff_target:
    source_field: buffTarget
    transform: direct
  buff_apply_chance:
    source_field: buffApplyChance
    transform: direct
gender_signals: []
overrides: {}
needs_review: []

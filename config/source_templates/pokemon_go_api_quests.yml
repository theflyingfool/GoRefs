source_key: pokemon_go_api
endpoint: quests
# Hand-authored (Task 20), not profiler-generated: quests.json is currently an
# empty top-level list upstream (confirmed pre-existing, not a bug -- see
# KNOWN_ISSUES.md "Still open" list at the time of the prior pass, re-confirmed
# for this task). SourceProfiler.detect_shape() has no records to infer a shape
# from with zero rows, so this template's shape/field names are carried over
# from the pre-existing hand-parsed quests loop this task deletes. Unit-tested
# against a synthetic non-empty fixture (tests/test_engine_pokemon_go_api_quests.py)
# since the real build will legitimately show 0 rows -- re-run
# `uv run go_refs.py --deep-dive pokemon_go_api` once quest data actually
# appears upstream to confirm field names against real data.
#
# Single-source domain (pokemon_go_api only) with a simple (non-composite)
# identity, so this COULD go through run_source()'s ledger like species/forms/
# moves. Read via engine.extract_transformed_records() anyway for consistency
# with its raid_bosses/max_battles siblings (all three are built the same way
# in builder.py) -- not because quests specifically needs composite-key
# handling.
record_extraction:
  unwrap_path: []
  iterate_mode: top_level_list
identity_field: quest_id
field_mappings:
  quest_id:
    source_field: quest_id
    transform: nested_path
    fallback_field: id
  type:
    source_field: type
    transform: direct
  text:
    source_field: text
    transform: direct
  target:
    source_field: target
    transform: direct
  reward_type:
    source_field: reward_type
    transform: direct
  reward_detail:
    source_field: reward_detail
    transform: direct
gender_signals: []
overrides: {}
needs_review: []

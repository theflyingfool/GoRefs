# Pokémon GO Unified Reference API - Source Configuration Registry
# Defines upstream origins, priorities, trust levels, and endpoint configurations.

sources:
  alexelgt_game_masters:
    name: "Alexelgt GAME_MASTER Dumps"
    description: "Raw Niantic client GAME_MASTER.json data master"
    enabled: true
    trust_tier: "authoritative_game_master"
    priority: 2
    license: "Unspecified (Niantic Derived)"
    url: "https://raw.githubusercontent.com/alexelgt/game_masters/master/GAME_MASTER.json"
    local_dump_dir: "raw_dumps/alexelgt_game_masters"

  pokemon_go_api:
    name: "Pokémon GO API (pokemon-go-api.github.io)"
    description: "Community API providing species, forms, costumes, mega/gmax, combat stats, localized names, sprite URLs"
    enabled: true
    trust_tier: "pokemon_go_api"
    priority: 4
    license: "MIT"
    base_url: "https://pokemon-go-api.github.io/pokemon-go-api/api"
    assets_base_url: "https://raw.githubusercontent.com/pokemon-go-api/assets/master"
    endpoints:
      - name: "pokedex"
        path: "/pokedex.json"
      - name: "maxbattles"
        path: "/maxbattles.json"
      - name: "raidboss"
        path: "/raidboss.json"
      - name: "quests"
        path: "/quests.json"
      - name: "types"
        path: "/types.json"
    local_dump_dir: "raw_dumps/pokemon_go_api"
    asset_dump_dir: "raw_dumps/assets"

  pogoapi_net:
    name: "PoGO API (pogoapi.net)"
    description: "Legacy community API covering player progression, badges, PvP league rewards, buddy distances, flee rates, weather, shadow, etc."
    enabled: true
    trust_tier: "pogoapi_net"
    priority: 6
    license: "Unspecified"
    base_url: "https://pogoapi.net/api/v1"
    endpoints:
      - name: "cp_multiplier"
        path: "/cp_multiplier.json"
      - name: "pokemon_types"
        path: "/pokemon_types.json"
      - name: "type_effectiveness"
        path: "/type_effectiveness.json"
      - name: "weather_boosts"
        path: "/weather_boosts.json"
      - name: "pokemon_max_cp"
        path: "/pokemon_max_cp.json"
      - name: "pokemon_rarity"
        path: "/pokemon_rarity.json"
      - name: "pokemon_stats"
        path: "/pokemon_stats.json"
      - name: "fast_moves"
        path: "/fast_moves.json"
      - name: "charged_moves"
        path: "/charged_moves.json"
      - name: "shadow_pokemon"
        path: "/shadow_pokemon.json"
      - name: "mega_pokemon"
        path: "/mega_pokemon.json"
      - name: "community_days"
        path: "/community_days.json"
      - name: "alolan_pokemon"
        path: "/alolan_pokemon.json"
      - name: "galarian_pokemon"
        path: "/galarian_pokemon.json"
      - name: "released_pokemon"
        path: "/released_pokemon.json"
      - name: "nesting_pokemon"
        path: "/nesting_pokemon.json"
      - name: "shiny_pokemon"
        path: "/shiny_pokemon.json"
      - name: "baby_pokemon"
        path: "/baby_pokemon.json"
      - name: "badges"
        path: "/badges.json"
    local_dump_dir: "raw_dumps/pogoapi_net"

  pvpoke:
    name: "PvPoke GameMaster & Data"
    description: "PvPoke open-source PvP data master, move turns, energy costs, buff/debuff probabilities, and archetype definitions"
    enabled: true
    trust_tier: "pvpoke"
    priority: 5
    license: "MIT"
    url: "https://raw.githubusercontent.com/pvpoke/pvpoke/master/src/data/gamemaster.json"
    local_dump_dir: "raw_dumps/pvpoke"

  pokeapi:
    name: "PokeAPI (pokeapi.co)"
    description: "Comprehensive main-series Pokémon reference API for cross-referencing, Pokédex flavor text, category, and filling metadata gaps"
    enabled: true
    trust_tier: "pokeapi"
    priority: 7
    license: "BSD-3-Clause"
    base_url: "https://pokeapi.co/api/v2"
    auto_index: true
    local_dump_dir: "raw_dumps/pokeapi"


  rplus_shiny:
    name: "Rplus Pokémon GO Shiny Sheet"
    description: "Actively maintained community-tracked shiny release dates per form/species"
    enabled: true
    trust_tier: "rplus_shiny"
    priority: 3
    license: "Unspecified"
    url: "https://opensheet.elk.sh/13UreWc5Nq4yiLYvDRt2RyPWXsDx9y4pMWhSD0JsnHCw/1"
    local_dump_dir: "raw_dumps/rplus_shiny"

  local_authoring:
    name: "Confirmed Owner Submissions & Overrides"
    description: "In-repo hand-maintained spreadsheets, costume lookups, and owner corrections"
    enabled: true
    trust_tier: "confirmed_owner_submission"
    priority: 1
    license: "Project Internal"
    files:
      - "data-authoring/costume-lookup.json"
      - "data-authoring/community-submissions.json"
    local_dump_dir: "raw_dumps/local_authoring"
